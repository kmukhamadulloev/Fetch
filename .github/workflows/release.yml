name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate-release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-release-notes.sh
      - if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" >/dev/null

  package:
    needs: validate-release-notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: ./scripts/smoke-release.sh target/${{ matrix.target }}/release/fetch
      - if: runner.os == 'Windows'
        run: ./scripts/smoke-release.ps1 -Binary target/${{ matrix.target }}/release/fetch.exe
      - if: runner.os != 'Windows'
        run: ./scripts/package.sh ${{ matrix.target }} ${{ matrix.label }}
      - if: runner.os == 'Windows'
        run: ./scripts/package.ps1 -Target ${{ matrix.target }} -Label ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: fetch-${{ matrix.label }}
          path: target/release-artifacts/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Extract curated release notes
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --title "Fetch $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
