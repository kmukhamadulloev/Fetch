openapi: 3.1.0
info:
  title: Fetch API
  version: 0.1.7
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
security: []
paths:
  /api/files/{id}/processing:
    get:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Processing result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessingCapabilities'}
        '400': {description: Invalid options or opaque ID}
        '404': {description: Source or process not found}
        '409': {description: Source changed or action unavailable}
  /api/files/{id}/processes:
    post:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExportRequest"}
      responses:
        '202':
          description: Processing result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessingJob'}
        '400': {description: Invalid options or opaque ID}
        '404': {description: Source or process not found}
        '409': {description: Source changed or action unavailable}
  /api/processes:
    get:
      responses:
        '200':
          description: Processing result
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ProcessingJob'}}
        '400': {description: Invalid options or opaque ID}
        '404': {description: Source or process not found}
        '409': {description: Source changed or action unavailable}
  /api/processes/{id}/cancel:
    post:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Processing result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessingJob'}
        '400': {description: Invalid options or opaque ID}
        '404': {description: Source or process not found}
        '409': {description: Source changed or action unavailable}
  /api/processes/{id}/retry:
    post:
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        '202':
          description: Processing result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessingJob'}
        '400': {description: Invalid options or opaque ID}
        '404': {description: Source or process not found}
        '409': {description: Source changed or action unavailable}
  /api/status:
    get:
      responses:
        '200':
          description: Application status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppStatus'}
  /api/media/analyze:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string}
      responses:
        '200':
          description: Media analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaInfo'}
        '400': {$ref: '#/components/responses/Error'}
  /api/downloads:
    get:
      responses:
        '200':
          description: Download jobs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DownloadJob'}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDownloadRequest'}
      responses:
        '201':
          description: Created job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadJob'}
        '400': {$ref: '#/components/responses/Error'}
  /api/downloads/{id}:
    parameters:
      - {$ref: '#/components/parameters/DownloadId'}
    get:
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadJob'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      responses:
        '204': {description: Job metadata removed}
        '404': {$ref: '#/components/responses/Error'}
  /api/downloads/{id}/stop:
    post:
      parameters: [{$ref: '#/components/parameters/DownloadId'}]
      responses:
        '200': {description: Stop requested}
  /api/downloads/{id}/resume:
    post:
      parameters: [{$ref: '#/components/parameters/DownloadId'}]
      responses:
        '200': {description: Resume requested}
        '409': {$ref: '#/components/responses/Error'}
  /api/downloads/{id}/retry:
    post:
      parameters: [{$ref: '#/components/parameters/DownloadId'}]
      responses:
        '200': {description: Retry requested}
        '409': {$ref: '#/components/responses/Error'}
  /api/completed:
    get:
      responses:
        '200':
          description: Completed files
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CompletedFile'}
  /api/files/{id}:
    delete:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '204': {description: Completed media and cached artwork deleted; job history retained}
        '404': {$ref: '#/components/responses/Error'}
  /api/files/{id}/download:
    get:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200': {description: File download}
        '404': {$ref: '#/components/responses/Error'}
  /api/files/{id}/stream:
    get:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200': {description: Full file}
        '206': {description: Partial content}
        '404': {$ref: '#/components/responses/Error'}
  /api/files/{id}/thumbnail:
    get:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '200': {description: Cached media thumbnail}
        '404': {$ref: '#/components/responses/Error'}
  /api/files/{id}/reveal:
    post:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '204': {description: Containing folder opened on the Fetch host}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/files/{id}/metadata:
    parameters:
      - {$ref: '#/components/parameters/DownloadId'}
    get:
      summary: Inspect embedded tags and format capabilities through managed FFprobe
      responses:
        '200':
          description: Metadata, editable fields, embedded artwork availability, and read-only file information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaMetadata'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    put:
      summary: Start a recoverable background metadata save
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MetadataUpdate'}
      responses:
        '202':
          description: Accepted operation; monitor status or library.metadata SSE
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetadataSaveStatus'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413':
          description: Request exceeds 12 MiB
  /api/files/{id}/metadata/status:
    parameters:
      - {$ref: '#/components/parameters/DownloadId'}
    get:
      responses:
        '200':
          description: Latest session operation for this file; idle after server restart
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetadataSaveStatus'}
        '404': {$ref: '#/components/responses/Error'}
  /api/files/{id}/metadata/artwork:
    parameters:
      - {$ref: '#/components/parameters/DownloadId'}
    get:
      responses:
        '200':
          description: Embedded artwork preview as JPEG, no-store
          content:
            image/jpeg:
              schema: {type: string, contentEncoding: binary}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/files/{id}/progress:
    put:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaybackProgressUpdate'}
      responses:
        '200':
          description: Persisted shared playback progress
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlaybackProgress'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      parameters: [{$ref: '#/components/parameters/FileId'}]
      responses:
        '204': {description: Playback progress reset}
        '404': {$ref: '#/components/responses/Error'}
  /api/history:
    get:
      responses:
        '200':
          description: Job history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DownloadJob'}
  /api/settings:
    get:
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Settings'}
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Settings'}
      responses:
        '200':
          description: Saved settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingsSaveResponse'}
        '400': {$ref: '#/components/responses/Error'}
  /api/network:
    get:
      responses:
        '200':
          description: Local and LAN access information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NetworkInfo'}
  /api/proxy:
    get:
      description: >-
        Read outbound proxy settings available to yt-dlp and opt-in Telegram
        traffic from the Fetch host
      responses:
        '200':
          description: Proxy settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProxySettings'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      description: >-
        Validate, persist, and hot-apply outbound proxy settings available to
        yt-dlp and opt-in Telegram traffic on the Fetch host
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProxySettings'}
      responses:
        '200':
          description: Saved proxy settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProxySettings'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/telegram:
    get:
      description: Read non-secret Telegram settings and live status from the Fetch host
      responses:
        '200':
          description: Telegram integration state; never includes the bot token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelegramIntegration'}
        '403': {$ref: '#/components/responses/Error'}
  /api/telegram/settings:
    put:
      description: Validate, persist, and hot-apply Telegram settings on the Fetch host
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TelegramSettings'}
      responses:
        '200':
          description: Saved integration state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelegramIntegration'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/telegram/token:
    put:
      description: Store a bot token in the host native credential store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, writeOnly: true, maxLength: 512}
      responses:
        '200':
          description: Integration state without the token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelegramIntegration'}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      description: Remove the host-native token; an environment override is unaffected
      responses:
        '200':
          description: Integration state without the token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelegramIntegration'}
        '403': {$ref: '#/components/responses/Error'}
  /api/telegram/test:
    post:
      description: Test the effective bot token from the Fetch host
      responses:
        '200':
          description: Updated Telegram integration state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelegramIntegration'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/telegram/restart:
    post:
      description: Host-only restart using saved settings; cancels the previous worker and resets retries without changing the polling offset. Requires the integration to be enabled.
      responses:
        '200':
          description: Restart scheduled; current integration snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TelegramIntegration'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/logs:
    get:
      responses:
        '200':
          description: Retained structured process logs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DiagnosticLogEntry'}
    delete:
      responses:
        '204': {description: Logs cleared}
  /api/diagnostics:
    get:
      responses:
        '200':
          description: Database, runtime, and output checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticsReport'}
  /api/runtime:
    get:
      responses:
        '200':
          description: Runtime status
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RuntimeComponent'}
  /api/runtime/javascript:
    get:
      responses:
        '200':
          description: Host JavaScript runtime discovery status
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JavaScriptRuntime'}
  /api/runtime/{component}/install:
    post:
      parameters: [{$ref: '#/components/parameters/RuntimeComponent'}]
      responses:
        '202': {description: Installation started}
  /api/runtime/{component}/update:
    post:
      parameters: [{$ref: '#/components/parameters/RuntimeComponent'}]
      responses:
        '202': {description: Update started}
  /api/runtime/{component}/repair:
    post:
      parameters: [{$ref: '#/components/parameters/RuntimeComponent'}]
      responses:
        '202': {description: Repair started}
  /api/events:
    get:
      responses:
        '200':
          description: Server-Sent Event stream with an immediate opening comment and 15-second keepalives; events are not replayed
          content:
            text/event-stream:
              schema: {type: string}
components:
  parameters:
    DownloadId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    FileId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RuntimeComponent:
      name: component
      in: path
      required: true
      schema: {type: string, enum: [yt-dlp, ffmpeg, ffprobe]}
  responses:
    Error:
      description: Application error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    MediaMetadata:
      type: object
      required: [revision, editable, media_type, container, fields, supported_fields, artwork_available, artwork_editable, information]
      properties:
        revision: {type: string}
        editable: {type: boolean}
        media_type: {type: string, enum: [audio, video]}
        container: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        supported_fields: {type: array, items: {type: string}}
        artwork_available: {type: boolean}
        artwork_editable: {type: boolean}
        information: {type: object, additionalProperties: {type: string}}
    MetadataUpdate:
      type: object
      additionalProperties: false
      required: [revision, fields, artwork]
      properties:
        revision: {type: string, description: Opaque revision from the last inspection}
        fields:
          type: object
          description: Omitted fields are preserved; empty strings clear tags. Each value is at most 16384 UTF-8 bytes. Track/disc values are positive integers up to 65535 expressed as strings.
          propertyNames:
            enum: [title, artist, album, album_artist, track, track_total, date, genre, copyright, comment, description, disc, disc_total, composer]
          additionalProperties: {type: string}
        artwork:
          oneOf:
            - type: object
              additionalProperties: false
              required: [action]
              properties:
                action: {type: string, enum: [keep, remove]}
            - type: object
              additionalProperties: false
              required: [action, data]
              properties:
                action: {type: string, const: replace}
                data: {type: string, contentEncoding: base64, description: JPEG or PNG bytes up to 8 MiB; dimensions at most 8192 pixels per side; decoded image at most 128 MiB. Normalized to JPEG up to 2048 pixels per side.}
    MetadataSaveStatus:
      type: object
      required: [file_id, operation_id, state, error]
      properties:
        file_id: {type: string, format: uuid}
        operation_id: {type: [string, 'null'], format: uuid}
        state: {type: string, enum: [idle, saving, completed, failed]}
        error: {type: [string, 'null']}

    AppStatus:
      type: object
      required: [version, server, runtime_ready, storage_ready]
      properties:
        version: {type: string}
        server: {type: string}
        runtime_ready: {type: boolean}
        storage_ready: {type: boolean}
    MediaInfo:
      type: object
      required: [kind, title, entries, formats]
      properties:
        kind: {type: string, enum: [media, playlist]}
        id: {type: string}
        extractor: {type: string}
        title: {type: string}
        duration_seconds: {type: number}
        thumbnail_url: {type: string}
        webpage_url: {type: string}
        playlist_count: {type: integer}
        entries:
          type: array
          items: {$ref: '#/components/schemas/PlaylistEntry'}
        formats:
          type: array
          items: {$ref: '#/components/schemas/MediaFormat'}
    MediaFormat:
      type: object
      required: [id, label, has_video, has_audio]
      properties:
        id: {type: string}
        label: {type: string}
        extension: {type: string}
        video_codec: {type: string}
        audio_codec: {type: string}
        width: {type: integer}
        height: {type: integer}
        fps: {type: number}
        bitrate_kbps: {type: number}
        filesize_bytes: {type: integer}
        has_video: {type: boolean}
        has_audio: {type: boolean}
    PlaylistEntry:
      type: object
      required: [title]
      properties:
        id: {type: string}
        title: {type: string}
        url: {type: string}
        duration_seconds: {type: number}
        thumbnail_url: {type: string}
    CreateDownloadRequest:
      type: object
      required: [url, mode, embed_metadata, embed_thumbnail, subtitles]
      properties:
        url: {type: string}
        title: {type: string}
        duration_seconds: {type: number, minimum: 0}
        mode: {type: string, enum: [video, audio]}
        format_id: {type: string}
        quality: {type: string}
        container: {type: string}
        video_codec: {type: string}
        audio_codec: {type: string}
        embed_metadata: {type: boolean}
        embed_thumbnail: {type: boolean}
        subtitles: {type: boolean}
        playlist: {$ref: '#/components/schemas/PlaylistContext'}
        output_directory: {type: string}
    PlaylistContext:
      type: object
      required: [id, title, index]
      properties:
        id: {type: string}
        title: {type: string}
        index: {type: integer, minimum: 1}
    DownloadJob:
      type: object
      required: [id, url, mode, status, embed_metadata, embed_thumbnail, subtitles, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        url: {type: string}
        title: {type: string}
        duration_seconds: {type: number, minimum: 0}
        mode: {type: string, enum: [video, audio]}
        format_id: {type: string}
        quality: {type: string}
        container: {type: string}
        video_codec: {type: string}
        audio_codec: {type: string}
        embed_metadata: {type: boolean}
        embed_thumbnail: {type: boolean}
        subtitles: {type: boolean}
        playlist: {$ref: '#/components/schemas/PlaylistContext'}
        output_directory: {type: string}
        status:
          type: string
          enum: [created, analyzing, ready, queued, downloading, postprocessing, completed, failed, stopped]
        progress_percent: {type: number}
        downloaded_bytes: {type: integer}
        total_bytes: {type: integer}
        speed_bytes_per_second: {type: integer}
        eta_seconds: {type: integer}
        error_code: {type: string}
        error_message: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ExportRequest:
      type: object
      additionalProperties: false
      required: [revision, filename, format]
      properties:
        revision: {type: string}
        filename: {type: string, maxLength: 180}
        format: {type: string, enum: [mp4, mkv, m4a, mp3, flac, wav]}
        quality: {type: string, enum: [compact, balanced, high], default: balanced}
        stream_copy: {type: boolean, default: false}
        acknowledge_omissions: {type: boolean, default: false}
        edits:
          type: [object, "null"]
          additionalProperties: false
          properties:
            start_seconds: {type: [number, "null"], minimum: 0}
            end_seconds: {type: [number, "null"], exclusiveMinimum: 0}
            rotate: {type: integer, enum: [0, 90, 180, 270], default: 0}
            mute: {type: boolean, default: false}
            volume: {type: [number, "null"], minimum: 0, maximum: 4}
            crop:
              type: [object, "null"]
              additionalProperties: false
              required: [x, y, width, height]
              properties:
                x: {type: integer, minimum: 0}
                y: {type: integer, minimum: 0}
                width: {type: integer, minimum: 1}
                height: {type: integer, minimum: 1}
            resize:
              type: [object, "null"]
              additionalProperties: false
              required: [width, height]
              properties:
                width: {type: integer, minimum: 2, maximum: 7680, multipleOf: 2}
                height: {type: integer, minimum: 2, maximum: 7680, multipleOf: 2}
    ProcessingJob:
      type: object
      required: [id, kind, source_file_id, output_file_id, title, state, stage, progress_percent, eta_seconds, created_at, started_at, updated_at, finished_at, error]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [conversion, edit, metadata]}
        source_file_id: {type: string, format: uuid}
        output_file_id: {type: [string, "null"], format: uuid}
        title: {type: string}
        state: {type: string, enum: [queued, running, completed, failed, cancelled, interrupted]}
        stage: {type: string}
        progress_percent: {type: [number, "null"]}
        eta_seconds: {type: [number, "null"]}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
        error: {type: [string, "null"]}
        error_code: {type: [string, "null"], description: Stable Fetch error code for localized recovery guidance; absent in older persisted records.}
    ProcessingCapabilities:
      type: object
      required: [revision, duration_seconds, video, audio, width, height, formats, copy_formats, notices]
      properties:
        revision: {type: string}
        duration_seconds: {type: number}
        video: {type: boolean}
        audio: {type: boolean}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        formats: {type: array, items: {type: string}}
        copy_formats: {type: array, items: {type: string}}
        notices: {type: array, items: {type: string}}
    CompletedFile:
      type: object
      required: [id, job_id, origin, source_file_id, playlist, filename, thumbnail_available, size_bytes, mime_type, browser_playable, playback, created_at]
      properties:
        id: {type: string, format: uuid}
        job_id: {type: [string, "null"], format: uuid}
        origin: {type: [string, "null"], enum: [conversion, edit, null]}
        source_file_id: {type: [string, "null"], format: uuid}
        playlist:
          anyOf:
            - {$ref: '#/components/schemas/PlaylistContext'}
            - {type: 'null'}
        filename: {type: string}
        thumbnail_available: {type: boolean}
        size_bytes: {type: integer}
        mime_type: {type: string}
        title: {type: string}
        browser_playable: {type: boolean}
        playback:
          anyOf:
            - {$ref: '#/components/schemas/PlaybackProgress'}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
    PlaybackProgressUpdate:
      type: object
      required: [position_seconds, duration_seconds]
      properties:
        position_seconds: {type: number, minimum: 0}
        duration_seconds: {type: number, exclusiveMinimum: 0}
    PlaybackProgress:
      type: object
      required: [file_id, position_seconds, duration_seconds, completed, updated_at]
      properties:
        file_id: {type: string, format: uuid}
        position_seconds: {type: number, minimum: 0}
        duration_seconds: {type: number, exclusiveMinimum: 0}
        completed: {type: boolean}
        updated_at: {type: string, format: date-time}
    Settings:
      type: object
      required: [bind_address, port, allowed_networks, download_directory, concurrent_downloads, open_browser_on_start, start_with_system, ytdlp_auto_update, ytdlp_js_runtime]
      properties:
        bind_address: {type: string, default: 127.0.0.1}
        port: {type: integer, default: 8080}
        allowed_networks:
          type: array
          items: {type: string}
          default: [192.168.0.0/16]
        download_directory: {type: string}
        concurrent_downloads: {type: integer, minimum: 1, maximum: 16, default: 3}
        open_browser_on_start: {type: boolean, default: true}
        start_with_system: {type: boolean, default: false}
        ytdlp_auto_update: {type: boolean, default: true}
        ytdlp_js_runtime: {type: string, enum: [auto, deno, node, quickjs, disabled], default: auto}
    SettingsSaveResponse:
      allOf:
        - {$ref: '#/components/schemas/Settings'}
        - type: object
          required: [listener_changed]
          properties:
            listener_changed: {type: boolean}
    ProxySettings:
      type: object
      additionalProperties: false
      required: [mode, url]
      properties:
        mode: {type: string, enum: [system, direct, custom]}
        url:
          anyOf:
            - {type: string, format: uri, maxLength: 2048}
            - {type: 'null'}
    TelegramSettings:
      type: object
      additionalProperties: false
      required: [enabled, use_proxy, send_completed_media, upload_limit_mb, allowed_user_ids, notify_queued, notify_completed, notify_failed, privacy_acknowledged]
      properties:
        enabled: {type: boolean, default: false}
        use_proxy: {type: boolean, default: false}
        send_completed_media: {type: boolean, default: false}
        upload_limit_mb: {type: integer, minimum: 1, maximum: 50, default: 50}
        allowed_user_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {type: integer, minimum: 1}
        notify_queued: {type: boolean, default: true}
        notify_completed: {type: boolean, default: true}
        notify_failed: {type: boolean, default: true}
        privacy_acknowledged: {type: boolean, default: false}
    TelegramStatus:
      type: object
      required: [state, token_configured, token_source, bot_username, last_success_at, error, failed_attempts, retry_at]
      properties:
        failed_attempts: {type: integer, minimum: 0, maximum: 3}
        retry_at:
          description: UTC deadline for the next attempt; null when no retry is scheduled
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        state: {type: string, enum: [disabled, connecting, connected, backing_off, error]}
        token_configured: {type: boolean}
        token_source: {type: string, enum: [native, environment, missing]}
        bot_username:
          anyOf: [{type: string}, {type: 'null'}]
        last_success_at:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        error:
          anyOf: [{type: string}, {type: 'null'}]
    TelegramIntegration:
      type: object
      additionalProperties: false
      required: [settings, status]
      properties:
        settings: {$ref: '#/components/schemas/TelegramSettings'}
        status: {$ref: '#/components/schemas/TelegramStatus'}
    RuntimeComponent:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        version: {type: string}
        status: {type: string, enum: [missing, installing, ready, updating, failed]}
        progress_percent: {type: number}
        error: {type: string}
    JavaScriptRuntime:
      type: object
      required: [name, detected, version]
      properties:
        name: {type: string, enum: [deno, node, quickjs]}
        detected: {type: boolean}
        version:
          anyOf:
            - {type: string}
            - {type: 'null'}
    NetworkInfo:
      type: object
      required: [bind_address, port, urls, authentication, restart_required_after_bind_change, local_client]
      properties:
        bind_address: {type: string}
        port: {type: integer}
        urls:
          type: array
          items: {type: string, format: uri}
        authentication: {type: boolean, const: false}
        restart_required_after_bind_change: {type: boolean}
        local_client: {type: boolean}
    DiagnosticLogEntry:
      type: object
      required: [id, level, subsystem, message, created_at]
      properties:
        id: {type: integer}
        level: {type: string}
        subsystem: {type: string}
        message: {type: string}
        details: {type: string}
        created_at: {type: string, format: date-time}
    DiagnosticsReport:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            type: object
            required: [name, healthy, message]
            properties:
              name: {type: string}
              healthy: {type: boolean}
              message: {type: string}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details: {}
