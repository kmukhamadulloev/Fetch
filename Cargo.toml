[workspace]
resolver = "2"
members = [
  "app/fetch",
  "crates/fetch-core",
  "crates/fetch-ytdlp",
  "crates/fetch-runtime",
  "crates/fetch-storage",
  "crates/fetch-server",
  "crates/fetch-telegram",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.6"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.9"
directories = "6"
http = "1"
if-addrs = "0.14"
ipnet = "2"
libc = "0.2"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json", "socks", "system-proxy"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"
webbrowser = "1.2"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
