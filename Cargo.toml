[workspace]
resolver = "2"
members = [
  "app/fetch",
  "crates/fetch-core",
  "crates/fetch-ytdlp",
  "crates/fetch-runtime",
  "crates/fetch-storage",
  "crates/fetch-server",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
