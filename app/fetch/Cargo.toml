[package]
name = "fetch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fetch-core = { path = "../../crates/fetch-core" }
fetch-ytdlp = { path = "../../crates/fetch-ytdlp" }
fetch-runtime = { path = "../../crates/fetch-runtime" }
fetch-storage = { path = "../../crates/fetch-storage" }
fetch-server = { path = "../../crates/fetch-server" }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
chrono.workspace = true
directories.workspace = true
mime_guess.workspace = true
image.workspace = true
keyring.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
webbrowser.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }
winit.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
